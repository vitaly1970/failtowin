<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/favicon-180.png">
<title>Search — The Encyclopedia of Fuckups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<style>
.hero{background:var(--hero-bg);padding:26px 0 16px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 34%;gap:40px;align-items:center}
.hero-col{min-width:0}
.hero h1{
  font-family:var(--serif);font-weight:800;font-size:clamp(38px,4.4vw,60px);
  line-height:1.04;letter-spacing:-.02em;margin:0 0 34px;
}
.hero-art{margin:0}
.hero-art img{display:block;width:auto;height:auto;max-width:100%;max-height:250px;margin-left:auto}

.search{
  display:flex;align-items:center;gap:14px;background:#fff;
  border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 22px;
}
.search .mag{flex:0 0 20px;color:var(--muted)}
.search input{
  flex:1;min-width:0;border:0;outline:0;background:transparent;
  font-family:var(--sans);font-size:16px;color:var(--ink);padding:12px 0;
}
.search input::placeholder{color:var(--muted)}
.search button{
  flex:0 0 46px;width:46px;height:46px;border:0;border-radius:50%;
  background:var(--accent);color:#fff;cursor:pointer;line-height:0;
}
.search button:hover{background:#EE9247}

.results{padding:8px 0 70px}
.results[hidden]{display:none}
.count{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0 0 4px}
.list{margin-top:12px;border-top:1px solid var(--line)}
.item{
  display:flex;gap:20px;align-items:flex-start;
  padding:20px 0;border-bottom:1px solid var(--line);
}
.item:hover .item-title{color:var(--accent)}
.item-main{flex:1;min-width:0}
.item-title{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.2;letter-spacing:-.01em;margin:0 0 8px}
.item-topic{display:flex;align-items:center;gap:7px;margin:0 0 8px;font-size:13px;color:var(--muted)}
.item-topic img{display:block;height:24px;width:auto}
.item-snippet{font-size:14.5px;color:var(--body);line-height:1.5;margin:0}
.item-meta{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:18px;padding-top:4px}
.item-date{font-size:13px;color:var(--muted);white-space:nowrap}
.item-go{color:var(--ink);line-height:0}


@media(max-width:900px){
  .hero{padding:18px 0 40px}
  .hero-grid{grid-template-columns:1fr;gap:26px}
  .hero-art{order:-1;max-width:420px;margin:0 auto}
  .item{gap:14px}
  .item-meta{gap:12px}
}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="brand" href="index.html">
      <img src="assets/img/logo.jpeg" alt="The Encyclopedia of Fuckups">
      <span class="brand-name">The Encyclopedia<br>of Fuckups</span>
    </a>
    <a class="nav-submit" href="submit.html">Submit a fuckup</a>
  </div>
</header>

<main>

<section class="hero">
  <div class="wrap hero-grid">
    <div class="hero-col">
      <h1>Real stories<br>of real fuckups.</h1>

      <form class="search" id="search-form">
        <svg class="mag" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search for a fuckup</label>
        <input id="q" type="search" autocomplete="off" placeholder="I&rsquo;m about to&hellip;">
        <button type="submit" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </div>

    <p class="hero-art">
      <img src="assets/img/fedya-search.png" alt="Fedya, the encyclopedia's cat, looking through a magnifying glass at a desk covered in notes">
    </p>
  </div>
</section>

<section class="results" id="results" hidden>
  <div class="wrap">
    <h2 class="count" id="count" aria-live="polite">Searching&hellip;</h2>

    <div id="list" class="list"></div>
  </div>
</section>

</main>

<footer>
  <div class="wrap">
    <span>The Encyclopedia of Fuckups &middot; 2026 &middot; <a href="about.html">About</a></span>
    <span>Stories come from readers, interviews, podcasts and public posts. Each one is checked and structured before it goes live. <a href="submit.html">Submit a fuckup</a></span>
  </div>
</footer>

<script>
var TOPICS = {
  'work':'Work','relationships':'Relationships','family':'Family','dating':'Dating',
  'health':'Health','home':'Home','travel':'Travel','food':'Food','shopping':'Shopping',
  'money':'Money','education':'Education','technology':'Technology','cars':'Cars',
  'parenting':'Parenting','pets':'Pets','fitness':'Fitness','beauty':'Beauty',
  'fashion':'Fashion','social-media':'Social Media','diy-crafts':'DIY & Crafts'
};

function param(name){
  return (new URLSearchParams(location.search).get(name) || '').trim();
}

/* Reader language: address first, then browser, English otherwise. */
function readerLang(){
  var asked = param('lang');
  if (asked === 'ru' || asked === 'en') return asked;
  var nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
  return nav.indexOf('ru') === 0 ? 'ru' : 'en';
}

var LANG = readerLang();

function ago(dateStr){
  var stamp = String(dateStr || '').replace(' ', 'T');
  if (stamp && stamp.indexOf('Z') === -1 && stamp.indexOf('+') === -1) stamp += 'Z';
  var days = Math.round((Date.now() - new Date(stamp).getTime()) / 86400000);
  if (!isFinite(days)) return '';
  if (days < 1) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 7) return days + ' days ago';
  if (days < 14) return '1 week ago';
  if (days < 31) return Math.floor(days / 7) + ' weeks ago';
  if (days < 62) return '1 month ago';
  return Math.floor(days / 30) + ' months ago';
}

function storyHref(slug){
  var href = 'story.html?slug=' + encodeURIComponent(slug);
  if (param('lang')) href += '&lang=' + encodeURIComponent(LANG);
  return href;
}

var state = {query:'', page:1, shown:0};

function addItems(items){
  var list = document.getElementById('list');
  items.forEach(function(s){
    var a = document.createElement('a');
    a.className = 'item';
    a.href = storyHref(s.slug);
    var topicName = TOPICS[s.topic] || s.topic || '';
    a.innerHTML =
      '<div class="item-main">' +
        '<h3 class="item-title"></h3>' +
        '<p class="item-topic"><img src="assets/img/topics/' + s.topic + '.png" alt=""><span></span></p>' +
        '<p class="item-snippet"></p>' +
      '</div>' +
      '<div class="item-meta">' +
        '<span class="item-date"></span>' +
        '<span class="item-go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>' +
      '</div>';
    a.querySelector('.item-title').textContent = s.title;
    a.querySelector('.item-topic span').textContent = topicName;
    a.querySelector('.item-snippet').textContent = s.snippet;
    a.querySelector('.item-date').textContent = ago(s.date);
    list.appendChild(a);
  });
}

function moreButton(show){
  var old = document.getElementById('more');
  if (old) old.parentNode.removeChild(old);
  if (!show) return;
  var holder = document.createElement('p');
  holder.id = 'more';
  holder.style.padding = '22px 0 0';
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.textContent = 'Show more';
  btn.style.cssText = 'border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 26px;font-family:var(--sans);font-size:15px;color:var(--ink);cursor:pointer';
  btn.addEventListener('click', function(){
    state.page += 1;
    load(true);
  });
  holder.appendChild(btn);
  document.getElementById('list').parentNode.appendChild(holder);
}

function load(append){
  var results = document.getElementById('results');
  var countEl = document.getElementById('count');
  var list = document.getElementById('list');

  if (!state.query){
    results.hidden = true;
    list.innerHTML = '';
    moreButton(false);
    return;
  }

  results.hidden = false;
  if (!append){
    list.innerHTML = '';
    state.shown = 0;
    moreButton(false);
    countEl.textContent = 'Searching\u2026';
  }

  var url = '/api/search?q=' + encodeURIComponent(state.query) +
            '&lang=' + encodeURIComponent(LANG) +
            '&page=' + state.page;

  fetch(url)
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (!data || data.error) throw new Error('bad response');
      state.shown += (data.items || []).length;
      var word = data.total === 1 ? 'story' : 'stories';
      countEl.textContent = data.total + ' ' + word + ' matching \u201c' + state.query + '\u201d';
      addItems(data.items || []);
      moreButton(!!data.has_more);
    })
    .catch(function(){
      countEl.textContent = 'Search is not answering right now. Try again in a moment.';
      moreButton(false);
    });
}

(function init(){
  state.query = param('q');
  document.getElementById('q').value = state.query;
  load(false);

  document.getElementById('search-form').addEventListener('submit', function(e){
    e.preventDefault();
    var typed = document.getElementById('q').value.trim();
    if (!typed){ document.getElementById('q').focus(); return; }
    state.query = typed;
    state.page = 1;
    var url = 'search.html?q=' + encodeURIComponent(state.query);
    if (param('lang')) url += '&lang=' + encodeURIComponent(LANG);
    history.replaceState(null, '', url);
    load(false);
  });
})();
</script>

</body>
</html>
